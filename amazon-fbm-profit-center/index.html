function salesLineChart(os,m){let days={};os.filter(x=>x.status!='cancelled').forEach(x=>days[x.date]=(days[x.date]||0)+n(x.saleUsd)*n(x.fx));let entries=Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0]));if(!entries.length)return '<div class="empty">这个月还没有订单</div>';let w=760,h=230,l=48,r=22,t=28,b=36,max=Math.max(...entries.map(x=>n(x[1])),1),span=Math.max(entries.length-1,1),pts=entries.map((x,i)=>({x:entries.length==1?w/2:l+i*(w-l-r)/span,y:t+(max-n(x[1]))*(h-t-b)/max,label:x[0].slice(8)+'日',value:n(x[1])})),line=pts.map(p=>p.x+','+p.y).join(' '),area=pts[0].x+','+(h-b)+' '+line+' '+pts.at(-1).x+','+(h-b);return '<svg class="line-chart" viewBox="0 0 '+w+' '+h+'"><defs><linearGradient id="salesArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2479e8"/><stop offset="1" stop-color="#2479e8" stop-opacity="0"/></linearGradient></defs>'+[0,.25,.5,.75,1].map(q=>'<line class="chart-grid" x1="'+l+'" y1="'+(t+q*(h-t-b))+'" x2="'+(w-r)+'" y2="'+(t+q*(h-t-b))+'"/>').join('')+'<polygon class="chart-area" points="'+area+'"/><polyline class="chart-line" points="'+line+'"/>'+pts.map(p=>'<g class="chart-point"><circle class="chart-dot" cx="'+p.x+'" cy="'+p.y+'" r="5"/><text class="chart-label" text-anchor="middle" x="'+p.x+'" y="'+(h-10)+'">'+p.label+'</text><g class="chart-tip" transform="translate('+(p.x-43)+' '+Math.max(2,p.y-38)+')"><rect width="86" height="25" rx="6"/><text text-anchor="middle" x="43" y="16">'+p.label+' · '+money(p.value)+'</text></g></g>').join('')+'</svg>'}
function donutChart(items,label){let colors=['#2479e8','#845fd8','#20a79f','#ef9741','#e24d59','#62a4f2'],xs=items.map((x,i)=>({name:x[0],value:Math.max(0,n(x[1])),color:colors[i%colors.length]})).filter(x=>x.value>0),total=xs.reduce((a,x)=>a+x.value,0);if(!total)return '<div class="empty">暂无构成数据</div>';let r=62,c=2*Math.PI*r,offset=0,segs=xs.map(x=>{let len=x.value/total*c,part='<circle class="donut-segment" cx="90" cy="90" r="'+r+'" stroke="'+x.color+'" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-offset)+'"><title>'+x.name+'：'+money(x.value)+' · '+(x.value/total*100).toFixed(1)+'%</title></circle>';offset+=len;return part}).join('');return '<div class="donut-wrap"><svg class="donut-svg" viewBox="0 0 180 180"><circle class="donut-track" cx="90" cy="90" r="'+r+'"/><g class="donut-segments" transform="rotate(-90 90 90)">'+segs+'</g><text class="donut-center-text" text-anchor="middle" x="90" y="87">'+money(total)+'</text><text class="donut-center-sub" text-anchor="middle" x="90" y="104">'+label+'</text></svg><div class="donut-legend">'+xs.map(x=>'<div title="'+x.name+'：'+money(x.value)+'"><i style="background:'+x.color+'"></i><span>'+x.name+'</span><b>'+money(x.value)+' · '+((x.value/total)*100).toFixed(1)+'%</b></div>').join('')+'</div></div>'}
async function dashboard(){let d=await data(),m=viewMonth,os=d.orders.filter(x=>x.date.startsWith(m)&&x.status!='cancelled'),ex=d.expenses.filter(x=>x.date.startsWith(m)),af=d.aftersales.filter(x=>x.date.startsWith(m));let sales=os.reduce((a,x)=>a+n(x.saleUsd)*n(x.fx),0),purchase=os.reduce((a,x)=>a+n(x.purchase),0),shipping=os.reduce((a,x)=>a+n(x.shipping),0),direct=os.reduce((a,x)=>a+n(x.direct),0),cont=os.reduce((a,x)=>a+contribution(x),0),commission=sales*d.settings.commission,fixed=ex.filter(x=>x.fixed).reduce((a,x)=>a+n(x.amount),0),other=ex.filter(x=>!x.fixed).reduce((a,x)=>a+n(x.amount),0),loss=af.reduce((a,x)=>a+n(x.loss),0),net=cont-commission-fixed-other-loss;let cs=[['实际销售额',money(sales),''],['订单数',os.length+' 单',''],['采购总额',money(purchase),'purchase'],['运费总额',money(shipping),'shipping'],['产品贡献利润',money(cont),'green'],['运营抽成',money(commission),'orange'],['固定费用',money(fixed),''],['售后损失',money(loss),'red'],['其他费用',money(other),''],['最终净利润',money(net),net>=0?'green':'red']];return `<div class="month-switch"><b>查看月份</b><small>订单、费用和售后按发生日期自动归入对应月份</small><input type="month" value="${m}" onchange="setViewMonth(this.value)"></div><div class="notice">✓ 当前显示 ${m} 的经营数据。订单销售额按实填金额入账，不重复扣 Amazon 平台抽佣。</div><div class="cards">${cs.map(x=>`<div class="card ${x[2]}"><small>${m} · ${x[0]}</small><strong>${x[1]}</strong><em>${x[0]=='最终净利润'&&sales?(net/sales*100).toFixed(1)+'% 净利率':'所选月份实时数据'}</em></div>`).join('')}</div><div class="grid"><section class="panel"><div class="panelhead"><div><h3>实际销售额趋势</h3><p>${m} 每日实填销售额</p></div></div><div class="chart">${salesLineChart(os,m)}</div></section><section class="panel"><div class="panelhead"><div><h3>利润结构</h3><p>${m} 损益摘要</p></div></div><div>${donutChart([['采购成本',purchase],['物流成本',shipping],['订单直接成本',direct],['运营抽成',commission],['店铺费用/售后',fixed+other+loss]],'成本与费用')}</div><div class="structure"><div>实际销售额<b>${money(sales)}</b></div><div>采购总额<b class="negative">-${money(purchase)}</b></div><div>运费总额<b class="negative">-${money async function products(){let raw=await all('products'),ps=sortProducts(raw.filter(p=>productStatus=='all'||(p.status||'active')==productStatus));return `<section class="panel"><div class="toolbar"><div><h3>产品资料库</h3><p>SKU 独立管理，可导入和导出</p></div><button class="secondary" onclick="exportCSV('products')">导出 CSV</button><button class="primary" onclick="productForm()">＋ 新增产品</button></div><div class="filters"><input id="search" placeholder="搜索 ASIN、SKU 或产品名称" oninput="filterProduct(this.value)"><select onchange="setProductStatus(this.value)"><option value="all" ${productStatus=='all'?'selected':''}>全部状态</option><option value="active" ${productStatus=='active'?'selected':''}>在售</option><option value="archived" ${productStatus=='archived'?'selected':''}>已停用</option></select><select onchange="setProductSort(this.value)"><option value="newest" ${productSort=='newest'?'selected':''}>最新录入优先</option><option value="oldest" ${productSort=='oldest'?'selected':''}>最早录入优先</option><option value="asin" ${productSort=='asin'?'selected':''}>按 ASIN 排列</option><option value="price" ${productSort=='price'?'selected':''}>按售价从高到低</option><option value="margin" ${productSort=='margin'?'selected':''}>按利润率从高到低</option></select></div><table><thead><tr><th>序号</th><th>ASIN / SKU</th><th>产品名称</th><th>售价 / 汇率留痕</th><th>采购 + 运费</th><th>预计利润</th><th>利润率</th><th>目标最低售价</th><th>状态</th><th>操作</th></tr></thead><tbody id="productRows">${productRows(ps)}</tbody></table>${ps.length?'':'<div class="empty">暂无产品，点击“新增产品”开始</div>'}</section>`}function productRows(ps){return ps.map((p,rowIndex)=>{let fx=n(p.fx)||7.18,revenue=n(p.price)*fx,profit=revenue*.75-n(p.purchase)-n(p.shipping),margin=revenue?profit/revenue*100:0,target=n(p.target)||30,targetDecimal=target/100,minPrice=fx&&targetDecimal<.75?(n(p.purchase)+n(p.shipping))/(fx*(.75-targetDecimal)):0,reached=n(p.price)>=minPrice,recorded=p.fxRecordedAt||p.updatedAt?.slice(0,10)||'早期记录',historyCount=(p.fxHistory||[]).length;return `<tr data-search="${((p.sku||' async function productForm(pid=''){let s=await setting(),p=(await all('products')).find(x=>x.id==pid)||{id:id(),sku:'',asin:'',title:'',price:'',purchase:'',shipping:'',target:30,status:'active'};modal(`<div class="profit-entry"><div class="modalhead"><h2>⊕ ${pid?'编辑':'添加'}产品利润记录</h2><button class="x" onclick="closeModal()">×</button></div><div class="formula-note">固定公式：销售额 × 汇率 × <b>0.75</b> − 采购成本 − 实际运费。Amazon 平台抽佣系数已固定，无需重复录入。</div><form onsubmit="saveProduct(event,'${p.id}')"><div class="form"><label>美元兑人民币汇率 (USD/CNY) *<input id="pFx" name="fx" required type="number" step=".0001" value="${p.fx||s.fx}" oninput="productCalc()"></label><label>ASIN *<input name="asin" required value="${esc(p.asin)}" placeholder="如：B0XXXXXXXX"></label><label>SKU 编号（可选）<input name="sku" value="${esc(p.sku)}" placeholder="如：ASUS-RTX4060-01"></label><label>产品名称 / 备注<input name="title" value="${esc(p.title)}" placeholder="如：华硕 RTX 4060 显卡"></label><div class="formgrid"><label>销售额 (USD $) *<input id="pSale" name="price" required type="number" step=".01" value="${p.price}" placeholder="$ 0.00" oninput="productCalc()"></label><label>采购成本 (RMB ¥) *<input id="pPurchase" name="purchase" required type="number" step=".01" value="${p.purchase}" placeholder="¥ 0.00" oninput="productCalc()"></label><label>实际运费 (RMB ¥)<input id="pShip" name="shipping" type="number" step=".01" value="${p.shipping||0}" oninput="productCalc()"></label><label>自定义目标率 (%)<input id="pTarget" name="target" type="number" step=".1" value="${p.target||30}" oninput="productCalc()"></label></div><div class="profit-live"><div>计算实际利润 (RMB)：<b id="pProfitRmb">¥0.00</b></div><div>计算实际利润 (USD)：<b id="pProfitUsd">$0.00</b></div><div>当前实际利润率：<b id="pMargin">0.00%</b></div><div class="target good">30% 利润率所需售价：<b id="pNeed30">$0.00</b></div><div class="target">自定义目标所需售价：<b id="pNeedTarget">$0.00</b></div></div><button class="primary save-big">✓ 确认保存</button></div></form></div>`);setTimeout(productCalc,0)}

async function saveProduct(e,pid){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),products=await all('products'),old=products.find(x=>x.id==pid),existing=products.find(x=>String(x.asin).toUpperCase()==String(f.asin).toUpperCase()&&x.id!=pid);if(existing)return toast('这个 ASIN 已存在，请直接编辑原产品');let snapshot={price:n(f.price),fx:n(f.fx),target:n(f.target),recordedAt:new Date().toISOString()},changed=!old||n(old.price)!=snapshot.price||n(old.fx)!=snapshot.fx||n(old.target)!=snapshot.target,history=[...(old?.fxHistory||[])];if(changed)history.push(snapshot);try{await put('products',{...(old||{}),...f,id:pid,price:n(f.price),purchase:n(f.purchase),shipping:n(f.shipping),fx:n(f.fx),target:n(f.target),platformMultiplier:.75,fxRecordedAt:changed?today():(old?.fxRecordedAt||today()),fxHistory:history,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()});closeModal();toast('产品已保存，售价与汇率留痕已记录');render()}catch(x){toast('保存失败，请检查 ASIN 和输入内容')}}
async function orders(){let d=await data(),pm=Object.fromEntries(d.products.map(x=>[x.id,x])),rows=d.orders.filter(x=>x.date.startsWith(viewMonth)).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="month-switch"><b>订单月份</b><small>按成交日期自动归月</small><input type="month" value="${viewMonth}" onchange="setViewMonth(this.value)"></div><section class="panel"><div class="toolbar"><div><h3>订单管理</h3><p>保存产品、成本和成交日汇率快照；销售额按 ERP 实填金额入账</p></div><button class="secondary" onclick="exportCSV('orders')">导出 CSV</button><button class="primary" onclick="orderForm()">＋ 录入订单</button></div><table><thead><tr><th>订单 / 日期</th><th>ASIN / 产品快照</th><th>实际销售额</th><th>采购 / 运费</th><th>锁定汇率</th><th>贡献利润</th><th>操作</th></tr></thead><tbody>${rows.map(o=>{let p=pm[o.productId],asin=o.productAsin||p?.asin||'ASIN 未留存',sku=o.productSku||p?.sku||'',title=o.productTitle||p?.title||'历史产品';return `<tr><td><b>${esc(o.orderNo)}</b><small>${o.date}</small></td><td><b>${esc(asin)}</b><small>${sku?esc(sku)+' · ':''}${esc(title)}${!p?' · 产品库已停用/移除':''}</small></td><td>${usd(o.saleUsd)}<small>按实填金额</small></td><td>${money(n(o.purchase)+n(o.shipping))}<small>采购 ${money(o.purchase)} · 运费 ${money(o.shipping)}</small></td><td>${n(o.fx).toFixed(4)}<small>已锁定</small></td><td class="${contribution(o)>=0?'positive':'negative'}">${money(contribution(o))}</td><td><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="secondary" onclick="orderForm('${o.id}')">修改</button><button class="danger" onclick="removeItem('orders','${o.id}')">删除</button></div></td></tr>`}).join('')}</tbody></table>${rows.length?'':'<div class="empty">'+viewMonth+' 暂无订单</div>'}</section>`}
async function orderForm(orderId=''){let products=await all('products'),existing=orderId?(await all('orders')).find(x=>x.id==orderId):null,ps=products.filter(x=>x.status!='archived'||x.id==existing?.productId).sort((a,b)=>String(a.asin||'').localeCompare(String(b.asin||''))),s=await setting();if(!ps.length)return toast('请先在产品库新增产品');orderProductOptions=ps;orderPickerMatches=[];orderPickerIndex=-1;let p=products.find(x=>x.id==existing?.productId),date=existing?.date||(viewMonth==monthNow()?today():viewMonth+'-01');modal(`<div class="modalhead"><h2>${existing?'修改订单':'录入订单'}</h2><button class="x" onclick="closeModal()">×</button></div><form onsubmit="saveOrder(event,'${existing?.id||''}')"><div class="formgrid"><div class="form"><label>订单号 *<input name="orderNo" required value="${esc(existing?.orderNo||'')}"></label><label>成交日期 *<input name="date" type="date" required value="${date}"><small>系统按此日期自动归入对应月份</small></label><div class="order-product-label"><label for="orderProductSearch">产品 ASIN *</label><div class="product-picker" id="orderProductPicker"><div class="product-search-shell"><span class="product-search-icon">⌕</span><input class="product-search" id="orderProductSearch" autocomplete="off" value="${esc(p?p.asin+(p.sku?' · '+p.sku:''):'')}" placeholder="输入 ASIN、SKU 或产品名称" onfocus="openOrderProductPicker()" oninput="filterOrderProducts(this.value)" onkeydown="orderProductKeydown(event)"><button class="product-picker-toggle" type="button" aria-label="展开产品列表" onclick="toggleOrderProductPicker()">⌄</button></div><input type="hidden" name="productId" id="orderProductId" value="${esc(existing?.productId||'')}"><div class="product-picker-menu" id="orderProductMenu"></div></div><div class="product-selected" id="orderProductSelected"></div><small class="product-picker-hint">这里只关联产品资料，销售额、采购和运费均由本单填写</small></div><label>实际销售额 USD *<input name="saleUsd" type="number" step=".01" required value="${existing?.saleUsd??''}"><small>按 ERP 中的实际金额填写，系统不会再次扣平台抽佣</small></label></div><div class="form"><label>USD/CNY 汇率 *<input name="fx" type="number" step=".0001" required value="${existing?.fx??s.fx}"><small>保存后锁定，不随当前汇率改变</small></label><div class="formula-note"><b>订单专用口径：</b>所有金额均按本单实际金额填写，不从产品库带入旧价格。</div><label>本单实际采购成本 RMB *<input name="purchase" id="orderPurchase" type="number" min="0" step=".01" required value="${existing?.purchase??''}"><small>每笔订单独立填写，不自动沿用产品库旧采购价</small></label><label>本单实际运费 RMB *<input name="shipping" id="orderShipping" type="number" min="0" step=".01" required value="${existing?.shipping??''}"><small>按本次实际运费填写，没有运费请填 0</small></label><label>订单直接成本 RMB<input name="direct" type="number" step=".01" value="${existing?.direct??0}"></label></div></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">取消</button><button class="primary">${existing?'保存修改':'保存订单'}</button></div></form>`);renderOrderProductOptions('');if(existing?.productId)setTimeout(()=>chooseOrderProduct(existing.productId),0)}
function orderProductSearchText(p){return [p.asin,p.sku,p.title].map(x=>String(x||'').toLowerCase()).join(' ')}
function renderOrderProductOptions(query=''){let menu=document.querySelector('#orderProductMenu');if(!menu)return;let q=String(query||'').trim().toLowerCase(),terms=q.split(/[·,，\s]+/).filter(Boolean),matches=terms.length?orderProductOptions.filter(p=>{let text=orderProductSearchText(p);return terms.every(t=>text.includes(t))}):orderProductOptions;orderPickerMatches=matches.slice(0,30);orderPickerIndex=orderPickerMatches.length?Math.min(Math.max(orderPickerIndex,0),orderPickerMatches.length-1):-1;if(!orderPickerMatches.length){menu.innerHTML='<div class="product-picker-empty"><b>没有找到匹配产品</b><br><small>请换一个 ASIN、SKU 或名称关键词</small></div>';return}menu.innerHTML=`<div class="product-picker-summary">找到 ${matches.length} 个产品 · 这里只选择产品，不带入任何金额</div>`+orderPickerMatches.map((p,i)=>`<button type="button" class="product-option ${i==orderPickerIndex?'active':''}" data-id="${esc(p.id)}" onclick="chooseOrderProduct(this.dataset.id)" onmousemove="setOrderPickerIndex(${i})"><span class="po-icon">${esc(String(p.asin||'').slice(-3)||'SKU')}</span><span class="po-main"><strong>${esc(p.asin||'未设置 ASIN')}${p.sku?' · '+esc(p.sku):''}</strong><span>${esc(p.title||'未填写产品名称')}</span></span></button>`).join('')}
function filterOrderProducts(value){let hidden=document.querySelector('#orderProductId'),selected=document.querySelector('#orderProductSelected'),picker=document.querySelector('#orderProductPicker');if(hidden)hidden.value='';if(selected)selected.classList.remove('show');picker?.classList.add('open');orderPickerIndex=-1;clearTimeout(orderPickerTimer);orderPickerTimer=setTimeout(()=>renderOrderProductOptions(value),60)}
function openOrderProductPicker(){document.querySelector('#orderProductPicker')?.classList.add('open');renderOrderProductOptions(document.querySelector('#orderProductSearch')?.value||'')}
function toggleOrderProductPicker(){let picker=document.querySelector('#orderProductPicker');if(!picker)return;let opening=!picker.classList.contains('open');picker.classList.toggle('open',opening);if(opening)renderOrderProductOptions(document.querySelector('#orderProductSearch')?.value||'')}
function setOrderPickerIndex(index){orderPickerIndex=index;document.querySelectorAll('#orderProductMenu .product-option').forEach((x,i)=>x.classList.toggle('active',i==index))}
function orderProductKeydown(e){let items=[...document.querySelectorAll('#orderProductMenu .product-option')];if(e.key=='ArrowDown'||e.key=='ArrowUp'){e.preventDefault();if(!items.length)return;orderPickerIndex=e.key=='ArrowDown'?Math.min(orderPickerIndex+1,items.length-1):Math.max(orderPickerIndex-1,0);setOrderPickerIndex(orderPickerIndex);items[orderPickerIndex]?.scrollIntoView({block:'nearest'})}else if(e.key=='Enter'&&items.length){e.preventDefault();chooseOrderProduct(items[Math.max(orderPickerIndex,0)].dataset.id)}else if(e.key=='Escape'){document.querySelector('#orderProductPicker')?.classList.remove('open')}}
function chooseOrderProduct(productId){let p=orderProductOptions.find(x=>String(x.id)==String(productId)),search=document.querySelector('#orderProductSearch'),hidden=document.querySelector('#orderProductId'),selected=document.querySelector('#orderProductSelected');if(!p||!search||!hidden)return;let changed=String(hidden.value)!=String(p.id);search.value=p.asin+(p.sku?' · '+p.sku:'');hidden.value=p.id;hidden.setAttribute('value',p.id);if(selected){selected.innerHTML=`<span class="selected-check">✓</span><div><b>已选择 ${esc(p.asin)}${p.sku?' · '+esc(p.sku):''}</b><span>${esc(p.title||'未填写产品名称')} · 仅关联产品资料，不带入任何金额</span></div>`;selected.classList.add('show')}let purchase=document.querySelector('#orderPurchase'),shipping=document.querySelector('#orderShipping');if(purchase){if(changed)purchase.value='';purchase.placeholder='请输入本单实际采购成本'}if(shipping){if(changed)shipping.value='';shipping.placeholder='请输入本单实际运费'}document.querySelector('#orderProductPicker')?.classList.remove('open');orderPickerIndex=-1}
async function saveOrder(e,orderId=''){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),orders=await all('orders'),existing=orders.find(x=>x.id==orderId),p=(await all('products')).find(x=>x.id==f.productId);if(!p){openOrderProductPicker();return toast('请先搜索并选择一个产品')}if(f.purchase===''||f.shipping==='')return toast('请填写本单实际采购成本和运费，没有费用请填 0');if(orders.some(x=>x.id!=orderId&&String(x.orderNo).trim()==String(f.orderNo).trim()))return toast('这个订单号已存在，请勿重复录入');try{let now=new Date().toISOString();await put('orders',{...f,id:existing?.id||id(),productAsin:p.asin||'',productSku:p.sku||'',productTitle:p.title||'',saleUsd:n(f.saleUsd),fx:n(f.fx),amazonFee:0,saleBasis:'actual',purchase:n(f.purchase),shipping:n(f.shipping),direct:n(f.direct),status:existing?.status||'completed',createdAt:existing?.createdAt||now,updatedAt:now});viewMonth=String(f.date).slice(0,7);closeModal();toast(existing?'订单修改已保存，相关报表已自动更新':'订单已保存：本单销售额、采购和运费均按实际金额锁定');render()}catch(x){toast('订单保存失败，请检查订单号是否重复')}}
async function calculator(){let s=await setting();return `<div class="formgrid"><section class="panel form"><h3>产品贡献利润试算</h3><p>固定公式：销售额 × 汇率 × 0.75 − 采购成本 − 运费。</p><label>售价 USD<input id="cSale" type="number" value="39.99" oninput="calc()"></label><label>汇率<input id="cFx" type="number" value="${s.fx}" oninput="calc()"></label><label>采购成本 RMB<input id="cPurchase" type="number" value="75" oninput="calc()"></label><label>实际运费 RMB<input id="cShip" type="number" value="42" oninput="calc()"></label></section><section class="calcResult"><small>产品实际利润</small><strong id="cProfit">¥0</strong><em id="cMargin">0% 利润率</em><div>销售额折合人民币<b id="cRmb"></b></div><div>Amazon 平台抽佣（25%）<b id="cFeeOut"></b></div><div>采购与物流<b id="cCost"></b></div></section></div>`+setTimeout(calc,0)}function calc(){let sale=n(val('cSale')),fx=n(val('cFx')),cost=n(val('cPurchase'))+n(val('cShip')),r=sale*fx,fee=r*.25,p=r*.75-cost;txt('cProfit',money(p));txt('cMargin',(r?p/r*100:0).toFixed(2)+'% 利润率');txt('cRmb',money(r));txt('cFeeOut','-'+money(fee));txt('cCost','-'+money(cost))}
async function monthly(){let d=await data(),m=viewMonth,os=d.orders.filter(x=>x.date.startsWith(m)&&x.status!='cancelled'),es=d.expenses.filter(x=>x.date.startsWith(m)),as=d.aftersales.filter(x=>x.date.startsWith(m)),sales=os.reduce((a,x)=>a+n(x.saleUsd)*n(x.fx),0),purchase=os.reduce((a,x)=>a+n(x.purchase),0),ship=os.reduce((a,x)=>a+n(x.shipping),0),direct=os.reduce((a,x)=>a+n(x.direct),0),orderCost=purchase+ship+direct,cont=sales-orderCost,comm=sales*d.settings.commission,fixedItems=es.filter(x=>x.fixed),otherItems=es.filter(x=>!x.fixed),fixed=fixedItems.reduce((a,x)=>a+n(x.amount),0),other=otherItems.reduce((a,x)=>a+n(x.amount),0),loss=as.reduce((a,x)=>a+n(x.loss),0),storeCost=comm+fixed+other+loss,net=cont-storeCost,margin=sales?net/sales:0;let detail=xs=>xs.map(x=>`<div class="pnl-row"><span>↳ ${esc(x.category)}${x.note?' · '+esc(x.note):''}</span><b class="negative">-${money(x.amount)}</b></div>`).join('');return `<div class="pnl-page"><section class="pnl-hero"><div class="pnl-hero-top"><div><h2>${m} 月经营损益</h2><p>订单、费用和售后自动汇总 · 共 ${os.length} 笔订单 · 销售额按实填金额入账</p></div><input type="month" value="${m}" onchange="setViewMonth(this.value)"></div><div class="pnl-kpis"><div class="pnl-kpi"><small>实际销售收入</small><strong>${money(sales)}</strong></div><div class="pnl-kpi"><small>产品贡献利润</small><strong class="up">${money(cont)}</strong></div><div class="pnl-kpi"><small>最终净利润</small><strong class="${net>=0?'up':'down'}">${money(net)}</strong></div><div class="pnl-kpi"><small>店铺净利率</small><strong class="${margin>=0?'up':'down'}">${(margin*100).toFixed(1)}%</strong></div></div></section><div class="pnl-flow"><div class="flow-card"><small>实际销售收入</small><b>${money(sales)}</b></div><div class="flow-arrow">−</div><div class="flow-card loss"><small>订单直接成本</small><b class="negative">${money(orderCost)}</b></div><div class="flow-arrow">＝</div><div class="flow-card result"><small>产品贡献利润</small><b class="positive">${money(cont)}</b></div><div class="flow-arrow">−</div><div class="flow-card loss"><small>店铺级费用</small><b class="negative">${money(storeCost)}</b></div><div class="flow-arrow">＝</div><div class="flow-card ${net>=0?'result':'loss'}"><small>最终净利润</small><b class="${net>=0?'positive':'negative'}">${money(net)}</b></div></div><div class="pnl-columns"><section class="pnl-section"><div class="pnl-section-head"><i>订</i><div><h3>订单收入与产品成本</h3><small>全部来自 ${m} 的订单快照</small></div><b>${money(cont)}</b></div><div class="pnl-row"><span>实际销售收入<small>${os.length} 笔订单按 ERP 实填金额折合人民币，不重复扣平台抽佣</small></span><b>${money(sales)}</b></div><div class="pnl-row"><span>采购成本</span><b class="negative">-${money(purchase)}</b></div><div class="pnl-row"><span>物流成本</span><b class="negative">-${money(ship)}</b></div><div class="pnl-row"><span>订单直接成本</span><b class="negative">-${money(direct)}</b></div><div class="pnl-row subtotal"><span>产品贡献利润</span><b class="${cont>=0?'positive':'negative'}">${money(cont)}</b></div></section><section class="pnl-section"><div class="pnl-section-head"><i>店</i><div><h3>店铺运营费用</h3><small>来自费用中心、售后与运营抽成</small></div><b class="negative">-${money(storeCost)}</b></div><div class="pnl-row"><span>运营抽成<small>月销售额 × ${(d.settings.commission*100).toFixed(1)}%</small></span><b class="negative">-${money(comm)}</b></div><div class="expense-group-head pnl-row" id="fixedHead" onclick="toggleExpenseGroup('fixed')"><span><i class="group-arrow">›</i>固定费用<small>${fixedItems.length} 笔 · 点击展开</small></span><b class="negative">-${money(fixed)}</b></div><section class="expense-group-details" id="fixedDetails">${detail(fixedItems)}</section><div class="expense-group-head pnl-row" id="otherHead" onclick="toggleExpenseGroup('other')"><span><i class="group-arrow">›</i>其他费用<small>${otherItems.length} 笔 · 点击展开</small></span><b class="negative">-${money(other)}</b></div><section class="expense-group-details" id="otherDetails">${detail(otherItems)}</section><div class="pnl-row"><span>退款 / 售后损失<small>${as.length} 笔售后记录</small></span><b class="negative">-${money(loss)}</b></div><div class="pnl-row subtotal"><span>店铺级费用合计</span><b class="negative">-${money(storeCost)}</b></div></section></div><div class="pnl-visuals"><section class="pnl-section"><div class="pnl-section-head"><i>趋</i><div><h3>每日实际销售趋势</h3><small>日期按时间顺序排列</small></div></div><div class="chart">${salesLineChart(os,m)}</div></section><section class="pnl-section"><div class="pnl-section-head"><i>构</i><div><h3>成本费用占比</h3><small>查看利润被哪些成本消耗</small></div></div>${donutChart([['采购成本',purchase],['物流成本',ship],['直接成本',direct],['店铺运营费用',storeCost]],'总成本')}</section></div><section class="pnl-final ${net<0?'negative-result':''}"><div><small>${m} 最终经营结果</small><strong>${net>=0?'本月实现盈利':'本月经营亏损'}</strong></div><strong class="${net>=0?'positive':'negative'}">${money(net)}</strong></section><p class="pnl-source">计算口径：订单实填销售收入 − 采购 − 物流 − 直接成本 − 运营抽成 − 固定费用 − 其他费用 − 售后损失</p></div>`}
function toggleExpenseGroup(name){let details=document.querySelector('#'+name+'Details'),head=document.querySelector('#'+name+'Head');if(!details||!head)return;let opening=!details.classList.contains('open');details.classList.toggle('open',opening);head.classList.toggle('open',opening);let note=head.querySelector('small');if(note)note.textContent=note.textContent.replace(opening?'点击展开':'点击收起',opening?'点击收起':'点击展开')}
async function expenses(){return listCenter('expenses','费用中心','新增费用',['Amazon 店租','ERP','浏览器','会计报税','软件订阅','银行/提现手续费','其他费用'])}async function aftersales(){return listCenter('aftersales','退款 / 售后','新增售后',['退款','补发','退货','货损'])}async function listCenter(store,title,add,cats){let xs=await all(store),isE=store=='expenses';return `<section class="panel"><div class="toolbar"><div><h3>${title}</h3><p>${isE?'每笔费用选择固定费用或其他费用，自动同步月度损益表':'售后损失自动同步月度损益表'}</p></div><button class="primary" onclick="centerForm('${store}')">＋ ${add}</button></div><table><thead><tr><th>日期</th><th>类别</th>${isE?'<th>费用性质</th>':''}<th>说明</th><th>金额</th><th>操作</th></tr></thead><tbody>${xs.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td>${isE?`<td><span class="badge" style="${x.fixed?'':'background:#eef2f7;color:#667386'}">${x.fixed?'固定费用':'其他费用'}</span></td>`:''}<td>${esc(x.note)}</td><td class="negative">-${money(isE?x.amount:x.loss)}</td><td><button class="danger" onclick="removeItem('${store}','${x.id}')">删除</button></td></tr>`).join('')}</tbody></table>${xs.length?'':'<div class="empty">暂无记录</div>'}</section>`}function centerForm(store){let isE=store=='expenses',cats=isE?['Amazon 店租','ERP','浏览器','会计报税','软件订阅','银行/提现手续费','其他费用']:['退款','补发','退货','货损'];modal(`<div class="modalhead"><h2>${isE?'新增费用':'新增售后'}</h2><button class="x" onclick="closeModal()">×</button></div><form onsubmit="saveCenter(event,'${store}')"><div class="form"><label>发生日期<input name="date" type="date" required value="${today()}"></label><label>类别<select name="category">${cats.map(x=>`<option>${x}</option>`).join('')}</select></label><label>实际金额 RMB<input name="amount" type="number" required step=".01"></label>${isE?'<label>费用性质<select name="nature"><option value="fixed">固定费用（每月店租、ERP等）</option><option value="other">其他费用（非固定支出）</option></select></label>':''}<label>说明<textarea name="note"></textarea></label><div class="formula-note">${isE?'保存后将按所选费用性质自动进入发生月份的损益表，无需重复录入。':'保存后自动进入发生月份的售后损失。'}</div></div><div class="actions"><button class="primary">保存并同步损益表</button></div></form>`)}async function saveCenter(e,store){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),v={id:id(),date:f.date,category:f.category,note:f.note||''};if(store=='expenses'){v.amount=n(f.amount);v.fixed=f.nature=='fixed'}else v.loss=n(f.amount);await put(store,v);closeModal();toast('记录已保存并同步月度损益表');render()}
async function sku(){let d=await data(),stat={};d.orders.filter(o=>o.status!='cancelled').forEach(o=>{let p=d.products.find(x=>x.id==o.productId);if(!p)return;stat[p.id]??={p,count:0,sales:0,profit:0};stat[p.id].count++;stat[p.id].sales+=n(o.saleUsd)*n(o.fx);stat[p.id].profit+=contribution(o)});let rows=Object.values(stat).sort((a,b)=>b.profit-a.profit);return `<div class="kpis"><div><small>产品总数</small><strong>${d.products.filter(p=>p.status!='archived').length}</strong></div><div><small>有销售 SKU</small><strong>${rows.length}</strong></div><div><small>盈利 SKU</small><strong class="positive">${rows.filter(x=>x.profit>=0).length}</strong></div><div><small>亏损 SKU</small><strong class="negative">${rows.filter(x=>x.profit<0).length}</strong></div></div><section class="panel"><div class="toolbar"><div><h3>SKU 盈利能力</h3><p>仅衡量产品贡献利润</p></div></div><table><thead><tr><th>SKU / 产品</th><th>订单</th><th>销售额</th><th>贡献利润</th><th>利润率</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.p.asin)}<small>${esc(x.p.sku)||'未设置 SKU'} · ${esc(x.p.title)}</small></td><td>${x.count}</td><td>${money(x.sales)}</td><td class="${x.profit>=0?'positive':'negative'}">${money(x.profit)}</td><td>${x.sales?(x.profit/x.sales*100).toFixed(1):0}%</td></tr>`).join('')}</tbody></table></section>`}
async function backup(){let d=await data(),count=d.products.length+d.orders.length+d.expenses.length+d.aftersales.length;return `<section class="panel backup"><h3>全部数据备份与恢复</h3><div class="backupBox"><div style="font-size:42px">🛡️</div><h2>保护你的全部经营数据</h2><p>导出文件包括产品、订单、费用、售后、汇率和系统设置。<br>建议每周导出一次，并保存到网盘或移动硬盘。</p><button class="primary" onclick="exportAll()">⇩ 一键导出全部数据</button><button class="secondary" onclick="document.querySelector('#restoreFile').click()">⇧ 从备份恢复</button></div><div class="backupInfo"><div><strong>${count} 条</strong><small>当前经营记录</small></div><div><strong>${d.settings.lastBackup}</strong><small>最近一次导出</small></div><div><strong>JSON 完整备份</strong><small>可跨电脑恢复</small></div></div><p style="color:#cf454c;margin-top:20px">注意：恢复会合并同 ID 数据。导入来历不明的备份前，请先导出当前数据。</p></section>`}
async function exportAll(){let payload={format:'Amazon-FBM-Profit-Backup',version:1,exportedAt:new Date().toISOString(),data:{}};for(let s of stores)payload.data[s]=await all(s);let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a'),date=new Date().toISOString().replace(/[:.]/g,'-');a.href=URL.createObjectURL(blob);a.download=`Amazon-FBM-全部数据备份-${date}.json`;a.click();URL.revokeObjectURL(a.href);await put('settings',{key:'lastBackup',value:new Date().toLocaleString('zh-CN')});toast('全部数据已导出，请保存到网盘');if(page=='backup')render()}
async function restoreAll(file){if(!file)return;try{let x=JSON.parse(await file.text());if(x.format!='Amazon-FBM-Profit-Backup'||!x.data||!Array.isArray(x.data.products)||!Array.isArray(x.data.orders))throw Error('FORMAT');if(!confirm('确定从此备份恢复？系统会按 ASIN 和订单号合并，避免重复。'))return;let currentProducts=await all('products'),idMap={};for(let item of x.data.products){let same=currentProducts.find(p=>p.id==item.id)||currentProducts.find(p=>String(p.asin||'').toUpperCase()==String(item.asin||'').toUpperCase());if(same){idMap[item.id]=same.id;await put('products',{...same,...item,id:same.id});}else{await put('products',item);currentProducts.push(item)}}let currentOrders=await all('orders');for(let item of x.data.orders){item={...item,productId:idMap[item.productId]||item.productId};let same=currentOrders.find(o=>o.id==item.id)||currentOrders.find(o=>String(o.orderNo).trim()==String(item.orderNo).trim());await put('orders',{...(same||{}),...item,id:same?.id||item.id});if(!same)currentOrders.push(item)}for(let s of ['expenses','aftersales','fxrates','settings'])for(let item of(x.data[s]||[]))await put(s,item);await repairData();toast('备份恢复成功，重复 ASIN 和订单号已自动合并');render()}catch(e){alert(e.message=='FORMAT'?'备份格式不正确，请选择本系统导出的 JSON 文件。':'恢复失败：'+(e.message||'请检查文件内容'))}finally{document.querySelector('#restoreFile').value=''}}
async function exportCSV(store){let xs=await all(store);if(!xs.length)return toast('没有可导出的数据');let keys=[...new Set(xs.flatMap(Object.keys))],csv='\ufeff'+[keys.join(','),...xs.map(x=>keys.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`${store}-${today()}.csv`;a.click();URL.revokeObjectURL(a.href)}
async function settings(){let s=await setting();return `<div class="formgrid"><section class="panel form"><h3>经营参数</h3><form onsubmit="saveSettings(event)"><label>运营抽成比例 %<input name="commission" type="number" step=".01" value="${s.commission*100}"></label><div class="formula-note">产品库选品试算固定使用 0.75；订单销售额按 ERP 实填金额入账，不重复扣平台抽佣。</div><label>当前 USD/CNY 汇率<input name="fx" type="number" step=".0001" value="${s.fx}"></label><button class="primary">保存设置</button></form></section><section class="panel backup"><h3>数据存储说明</h3><p>数据保存在当前浏览器的 IndexedDB 数据库中，不会发送到任何第三方服务器。</p><p>历史订单保存自己的成交日汇率，不会因为修改当前汇率而变化。</p><button class="primary" onclick="exportAll()">立即导出完整备份</button></section></div>`}async function saveSettings(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));await Promise.all([put('settings',{key:'commission',value:n(f.commission)/100}),put('settings',{key:'fx',value:n(f.fx)})]);toast('设置已保存');updateFx();render()}async function updateFx(){let s=await setting();txt('fxShow','USD/CNY '+n(s.fx).toFixed(4))}
async function removeItem(store,k){if(store=='products'){let linked=(await all('orders')).some(x=>x.productId==k),p=(await all('products')).find(x=>x.id==k);if(linked){if(!confirm('这个产品已有历史订单，不能硬删除。是否改为停用？'))return;await put('products',{...p,status:'archived',updatedAt:new Date().toISOString()});toast('产品已停用，历史订单关联已保留');return render()}}if(confirm('确定删除这条记录吗？')){await del(store,k);toast('已删除');render()}}function setViewMonth(v){viewMonth=v||monthNow();render()}function quickAdd(){productForm()}function modal(h){document.querySelector('#modalbox').innerHTML=h;document.querySelector('#modal').classList.add('open')}function closeModal(){document.querySelector('#modal').classList.remove('open')}function val(i){return document.querySelector('#'+i)?.value||0}function txt(i,t){let x=document.querySelector('#'+i);if(x)x.textContent=t}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function repairData(){let ps=await all('products'),seen={};for(let p of ps){let key=String(p.asin||'').trim().toUpperCase();if(!key){if(!p.status)await put('products',{...p,status:'active'});continue}if(!seen[key]){seen[key]=p;if(!p.status)await put('products',{...p,status:'active'})}else if(p.status!='archived'){await put('products',{...p,status:'archived',duplicateOf:seen[key].id,updatedAt:new Date().toISOString()})}}let os=await all('orders'),orderSeen={};for(let o of os){let key=String(o.orderNo||'').trim(),updated={...o},changed=false;if(updated.saleBasis!='actual'||n(updated.amazonFee)!=0){updated.saleBasis='actual';updated.amazonFee=0;changed=true}if(key&&orderSeen[key]&&updated.status!='cancelled'){updated.status='cancelled';updated.duplicateOf=orderSeen[key].id;changed=true}else if(key)orderSeen[key]=updated;if(changed)await put('orders',updated)}}
document.addEventListener('click',e=>{let picker=document.querySelector('#orderProductPicker');if(picker&&!picker.contains(e.target))picker.classList.remove('open')})
openDB().then(async()=>{await repairData();nav();await updateFx();render()}).catch(()=>document.querySelector('#content').innerHTML='<div class="notice">浏览器不支持本地数据库，请使用最新版 Chrome 或 Edge。</div>');
</script></body></html>
