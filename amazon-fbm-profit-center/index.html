const DB='amazon_fbm_profit_v1',VER=2,stores=['products','orders','expenses','aftersales','fxrates','settings'];let db,page='dashboard',viewMonth=new Date().toISOString().slice(0,7);const pages={dashboard:'经营总览',orders:'订单管理',products:'产品库',monthly:'月度盈亏',expenses:'费用中心',aftersales:'退款 / 售后',sku:'SKU 利润分析',backup:'数据备份与恢复',settings:'系统设置'};let productSort='newest';
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('products')){let s=d.createObjectStore('products',{keyPath:'id'});s.createIndex('sku','sku',{unique:false});s.createIndex('title','title')}else{let s=r.transaction.objectStore('products');if(s.indexNames.contains('sku'))s.deleteIndex('sku');s.createIndex('sku','sku',{unique:false})}if(!d.objectStoreNames.contains('orders')){let s=d.createObjectStore('orders',{keyPath:'id'});s.createIndex('productId','productId');s.createIndex('date','date');s.createIndex('orderNo','orderNo',{unique:true})}['expenses','aftersales','fxrates'].forEach(x=>{if(!d.objectStoreNames.contains(x))d.createObjectStore(x,{keyPath:'id'})});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>ok(db=r.result);r.onerror=()=>no(r.error)})}
function all(s){return new Promise((ok,no)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function put(s,v){return new Promise((ok,no)=>{let r=db.transaction(s,'readwrite').objectStore(s).put(v);r.onsuccess=()=>ok(v);r.onerror=()=>no(r.error)})}function del(s,k){return new Promise((ok,no)=>{let r=db.transaction(s,'readwrite').objectStore(s).delete(k);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}const id=()=>crypto.randomUUID(),n=v=>Number(v||0),money=v=>'¥'+n(v).toLocaleString('zh-CN',{maximumFractionDigits:2}),usd=v=>'$'+n(v).toFixed(2),today=()=>new Date().toISOString().slice(0,10),monthNow=()=>new Date().toISOString().slice(0,7);function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
async function setting(){let a=await all('settings');return Object.assign({commission:.1,defaultFee:.15,fx:7.18,lastBackup:'从未备份'},Object.fromEntries(a.map(x=>[x.key,x.value])))}function contribution(o){return n(o.saleUsd)*n(o.fx)*.75-n(o.purchase)-n(o.shipping)-n(o.direct)}
function nav(){document.querySelector('#nav').innerHTML=Object.entries(pages).map(([k,v])=>`<button class="${k==page?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}async function go(p){page=p;nav();document.querySelector('#title').textContent=pages[p];document.querySelector('#subtitle').textContent=p=='backup'?'完整导出所有经营数据，随时恢复':'所有数据保存在当前浏览器的专用数据库';await render()}
async function render(){let fn={dashboard,products,orders,monthly,expenses,aftersales,sku,backup,settings}[page]||dashboard;document.querySelector('#content').innerHTML=await fn()}
async function data(){let [products,orders,expenses,aftersales,settings]=await Promise.all(['products','orders','expenses','aftersales'].map(all).concat(setting()));return{products,orders,expenses,aftersales,settings}}
function salesLineChart(os,m){let days={};os.filter(x=>x.status!='cancelled').forEach(x=>days[x.date]=(days[x.date]||0)+n(x.saleUsd)*n(x.fx));let entries=Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0]));if(!entries.length)return '<div class="empty">这个月还没有订单</div>';let w=760,h=230,l=45,r=18,t=22,b=35,max=Math.max(...entries.map(x=>n(x[1])),1),span=Math.max(entries.length-1,1),pts=entries.map((x,i)=>({x:l+i*(w-l-r)/span,y:t+(max-n(x[1]))*(h-t-b)/max,label:x[0].slice(8)+'日',value:n(x[1])})),line=pts.map(p=>p.x+','+p.y).join(' '),area=l+','+(h-b)+' '+line+' '+pts.at(-1).x+','+(h-b);return '<svg class="line-chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><defs><linearGradient id="salesArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2479e8"/><stop offset="1" stop-color="#2479e8" stop-opacity="0"/></linearGradient></defs>'+[0,.25,.5,.75,1].map(q=>'<line class="chart-grid" x1="'+l+'" y1="'+(t+q*(h-t-b))+'" x2="'+(w-r)+'" y2="'+(t+q*(h-t-b))+'"/>').join('')+'<polygon class="chart-area" points="'+area+'"/><polyline class="chart-line" points="'+line+'"/>'+pts.map(p=>'<g><circle class="chart-dot" cx="'+p.x+'" cy="'+p.y+'" r="5"><title>'+p.label+' · '+money(p.value)+'</title></circle><text class="chart-value" text-anchor="middle" x="'+p.x+'" y="'+(p.y-11)+'">'+money(p.value)+'</text><text class="chart-label" text-anchor="middle" x="'+p.x+'" y="'+(h-10)+'">'+p.label+'</text></g>').join('')+'</svg>'}
function donutChart(items,label){let colors=['#2479e8','#845fd8','#20a79f','#ef9741','#e24d59','#62a4f2'],xs=items.map((x,i)=>({name:x[0],value:Math.max(0,n(x[1])),color:colors[i%colors.length]})).filter(x=>x.value>0),total=xs.reduce((a,x)=>a+x.value,0);if(!total)return '<div class="empty">暂无构成数据</div>';let at=0,parts=xs.map(x=>{let start=at,end=at+x.value/total*360;at=end;return x.color+' '+start+'deg '+end+'deg'});return '<div class="donut-wrap"><div class="donut" style="background:conic-gradient('+parts.join(',')+')"><div class="donut-center"><strong>'+money(total)+'</strong><small>'+label+'</small></div></div><div class="donut-legend">'+xs.map(x=>'<div><i style="background:'+x.color+'"></i><span>'+x.name+'</span><b>'+((x.value/total)*100).toFixed(1)+'%</b></div>').join('')+'</div></div>'}

async function calculator(){let s=await setting();return `<div class="formgrid"><section class="panel form"><h3>产品贡献利润试算</h3><p>固定公式：销售额 × 汇率 × 0.75 − 采购成本 − 运费。</p><label>售价 USD<input id="cSale" type="number" value="39.99" oninput="calc()"></label><label>汇率<input id="cFx" type="number" value="${s.fx}" oninput="calc()"></label><label>采购成本 RMB<input id="cPurchase" type="number" value="75" oninput="calc()"></label><label>实际运费 RMB<input id="cShip" type="number" value="42" oninput="calc()"></label></section><section class="calcResult"><small>产品实际利润</small><strong id="cProfit">¥0</strong><em id="cMargin">0% 利润率</em><div>销售额折合人民币<b id="cRmb"></b></div><div>Amazon 平台抽佣（25%）<b id="cFeeOut"></b></div><div>采购与物流<b id="cCost"></b></div></section></div>`+setTimeout(calc,0)}function calc(){let sale=n(val('cSale')),fx=n(val('cFx')),cost=n(val('cPurchase'))+n(val('cShip')),r=sale*fx,fee=r*.25,p=r*.75-cost;txt('cProfit',money(p));txt('cMargin',(r?p/r*100:0).toFixed(2)+'% 利润率');txt('cRmb',money(r));txt('cFeeOut','-'+money(fee));txt('cCost','-'+money(cost))}
async function monthly(){let d=await data(),m=viewMonth,os=d.orders.filter(x=>x.date.startsWith(m)&&x.status!='cancelled'),es=d.expenses.filter(x=>x.date.startsWith(m)),as=d.aftersales.filter(x=>x.date.startsWith(m)),sales=os.reduce((a,x)=>a+n(x.saleUsd)*n(x.fx),0),amazon=sales*.25,purchase=os.reduce((a,x)=>a+n(x.purchase),0),ship=os.reduce((a,x)=>a+n(x.shipping),0),direct=os.reduce((a,x)=>a+n(x.direct),0),orderCost=amazon+purchase+ship+direct,cont=sales-orderCost,comm=sales*d.settings.commission,fixedItems=es.filter(x=>x.fixed),otherItems=es.filter(x=>!x.fixed),fixed=fixedItems.reduce((a,x)=>a+n(x.amount),0),other=otherItems.reduce((a,x)=>a+n(x.amount),0),loss=as.reduce((a,x)=>a+n(x.loss),0),storeCost=comm+fixed+other+loss,net=cont-storeCost,margin=sales?net/sales:0;let detail=xs=>xs.map(x=>`<div class="pnl-row"><span>↳ ${esc(x.category)}${x.note?' · '+esc(x.note):''}</span><b class="negative">-${money(x.amount)}</b></div>`).join('');return `<div class="pnl-page"><section class="pnl-hero"><div class="pnl-hero-top"><div><h2>${m} 月经营损益</h2><p>订单、费用和售后自动汇总 · 共 ${os.length} 笔订单</p></div><input type="month" value="${m}" onchange="setViewMonth(this.value)"></div><div class="pnl-kpis"><div class="pnl-kpi"><small>销售收入</small><strong>${money(sales)}</strong></div><div class="pnl-kpi"><small>产品贡献利润</small><strong class="up">${money(cont)}</strong></div><div class="pnl-kpi"><small>最终净利润</small><strong class="${net>=0?'up':'down'}">${money(net)}</strong></div><div class="pnl-kpi"><small>店铺净利率</small><strong class="${margin>=0?'up':'down'}">${(margin*100).toFixed(1)}%</strong></div></div></section><div class="pnl-flow"><div class="flow-card"><small>销售收入</small><b>${money(sales)}</b></div><div class="flow-arrow">−</div><div class="flow-card loss"><small>订单直接成本</small><b class="negative">${money(orderCost)}</b></div><div class="flow-arrow">＝</div><div class="flow-card result"><small>产品贡献利润</small><b class="positive">${money(cont)}</b></div><div class="flow-arrow">−</div><div class="flow-card loss"><small>店铺级费用</small><b class="negative">${money(storeCost)}</b></div><div class="flow-arrow">＝</div><div class="flow-card ${net>=0?'result':'loss'}"><small>最终净利润</small><b class="${net>=0?'positive':'negative'}">${money(net)}</b></div></div><div class="pnl-columns"><section class="pnl-section"><div class="pnl-section-head"><i>订</i><div><h3>订单收入与产品成本</h3><small>全部来自 ${m} 的订单快照</small></div><b>${money(cont)}</b></div><div class="pnl-row"><span>销售收入<small>${os.length} 笔订单折合人民币</small></span><b>${money(sales)}</b></div><div class="pnl-row"><span>Amazon 平台抽佣<small>销售额 × 25%</small></span><b class="negative">-${money(amazon)}</b></div><div class="pnl-row"><span>采购成本</span><b class="negative">-${money(purchase)}</b></div><div class="pnl-row"><span>物流成本</span><b class="negative">-${money(ship)}</b></div><div class="pnl-row"><span>订单直接成本</span><b class="negative">-${money(direct)}</b></div><div class="pnl-row subtotal"><span>产品贡献利润</span><b class="${cont>=0?'positive':'negative'}">${money(cont)}</b></div></section><section class="pnl-section"><div class="pnl-section-head"><i>店</i><div><h3>店铺运营费用</h3><small>来自费用中心、售后与运营抽成</small></div><b class="negative">-${money(storeCost)}</b></div><div class="pnl-row"><span>运营抽成<small>月销售额 × ${(d.settings.commission*100).toFixed(1)}%</small></span><b class="negative">-${money(comm)}</b></div><div class="expense-group-head pnl-row" id="fixedHead" onclick="toggleExpenseGroup('fixed')"><span><i class="group-arrow">›</i>固定费用<small>${fixedItems.length} 笔 · 点击展开</small></span><b class="negative">-${money(fixed)}</b></div><section class="expense-group-details" id="fixedDetails">${detail(fixedItems)}</section><div class="expense-group-head pnl-row" id="otherHead" onclick="toggleExpenseGroup('other')"><span><i class="group-arrow">›</i>其他费用<small>${otherItems.length} 笔 · 点击展开</small></span><b class="negative">-${money(other)}</b></div><section class="expense-group-details" id="otherDetails">${detail(otherItems)}</section><div class="pnl-row"><span>退款 / 售后损失<small>${as.length} 笔售后记录</small></span><b class="negative">-${money(loss)}</b></div><div class="pnl-row subtotal"><span>店铺级费用合计</span><b class="negative">-${money(storeCost)}</b></div></section></div><div class="pnl-visuals"><section class="pnl-section"><div class="pnl-section-head"><i>趋</i><div><h3>每日销售趋势</h3><small>日期按时间顺序排列</small></div></div><div class="chart">${salesLineChart(os,m)}</div></section><section class="pnl-section"><div class="pnl-section-head"><i>构</i><div><h3>成本费用占比</h3><small>查看利润被哪些成本消耗</small></div></div>${donutChart([['Amazon平台抽佣',amazon],['采购成本',purchase],['物流成本',ship],['直接成本',direct],['店铺运营费用',storeCost]],'总成本')}</section></div><section class="pnl-final ${net<0?'negative-result':''}"><div><small>${m} 最终经营结果</small><strong>${net>=0?'本月实现盈利':'本月经营亏损'}</strong></div><strong class="${net>=0?'positive':'negative'}">${money(net)}</strong></section><p class="pnl-source">计算口径：销售收入 − Amazon平台抽佣 − 采购 − 物流 − 直接成本 − 运营抽成 − 固定费用 − 其他费用 − 售后损失</p></div>`}
function toggleExpenseGroup(name){let details=document.querySelector('#'+name+'Details'),head=document.querySelector('#'+name+'Head');if(!details||!head)return;let opening=!details.classList.contains('open');details.classList.toggle('open',opening);head.classList.toggle('open',opening);let note=head.querySelector('small');if(note)note.textContent=note.textContent.replace(opening?'点击展开':'点击收起',opening?'点击收起':'点击展开')}
async function expenses(){return listCenter('expenses','费用中心','新增费用',['Amazon 店租','ERP','浏览器','会计报税','软件订阅','银行/提现手续费','其他费用'])}async function aftersales(){return listCenter('aftersales','退款 / 售后','新增售后',['退款','补发','退货','货损'])}async function listCenter(store,title,add,cats){let xs=await all(store),isE=store=='expenses';return `<section class="panel"><div class="toolbar"><div><h3>${title}</h3><p>${isE?'每笔费用选择固定费用或其他费用，自动同步月度损益表':'售后损失自动同步月度损益表'}</p></div><button class="primary" onclick="centerForm('${store}')">＋ ${add}</button></div><table><thead><tr><th>日期</th><th>类别</th>${isE?'<th>费用性质</th>':''}<th>说明</th><th>金额</th><th>操作</th></tr></thead><tbody>${xs.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td>${isE?`<td><span class="badge" style="${x.fixed?'':'background:#eef2f7;color:#667386'}">${x.fixed?'固定费用':'其他费用'}</span></td>`:''}<td>${esc(x.note)}</td><td class="negative">-${money(isE?x.amount:x.loss)}</td><td><button class="danger" onclick="removeItem('${store}','${x.id}')">删除</button></td></tr>`).join('')}</tbody></table>${xs.length?'':'<div class="empty">暂无记录</div>'}</section>`}function centerForm(store){let isE=store=='expenses',cats=isE?['Amazon 店租','ERP','浏览器','会计报税','软件订阅','银行/提现手续费','其他费用']:['退款','补发','退货','货损'];modal(`<div class="modalhead"><h2>${isE?'新增费用':'新增售后'}</h2><button class="x" onclick="closeModal()">×</button></div><form onsubmit="saveCenter(event,'${store}')"><div class="form"><label>发生日期<input name="date" type="date" required value="${today()}"></label><label>类别<select name="category">${cats.map(x=>`<option>${x}</option>`).join('')}</select></label><label>实际金额 RMB<input name="amount" type="number" required step=".01"></label>${isE?'<label>费用性质<select name="nature"><option value="fixed">固定费用（每月店租、ERP等）</option><option value="other">其他费用（非固定支出）</option></select></label>':''}<label>说明<textarea name="note"></textarea></label><div class="formula-note">${isE?'保存后将按所选费用性质自动进入发生月份的损益表，无需重复录入。':'保存后自动进入发生月份的售后损失。'}</div></div><div class="actions"><button class="primary">保存并同步损益表</button></div></form>`)}async function saveCenter(e,store){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),v={id:id(),date:f.date,category:f.category,note:f.note||''};if(store=='expenses'){v.amount=n(f.amount);v.fixed=f.nature=='fixed'}else v.loss=n(f.amount);await put(store,v);closeModal();toast('记录已保存并同步月度损益表');render()}
async function sku(){let d=await data(),stat={};d.orders.forEach(o=>{let p=d.products.find(x=>x.id==o.productId);if(!p)return;stat[p.id]??={p,count:0,sales:0,profit:0};stat[p.id].count++;stat[p.id].sales+=n(o.saleUsd)*n(o.fx);stat[p.id].profit+=contribution(o)});let rows=Object.values(stat).sort((a,b)=>b.profit-a.profit);return `<div class="kpis"><div><small>产品总数</small><strong>${d.products.length}</strong></div><div><small>有销售 SKU</small><strong>${rows.length}</strong></div><div><small>盈利 SKU</small><strong class="positive">${rows.filter(x=>x.profit>=0).length}</strong></div><div><small>亏损 SKU</small><strong class="negative">${rows.filter(x=>x.profit<0).length}</strong></div></div><section class="panel"><div class="toolbar"><div><h3>SKU 盈利能力</h3><p>仅衡量产品贡献利润</p></div></div><table><thead><tr><th>SKU / 产品</th><th>订单</th><th>销售额</th><th>贡献利润</th><th>利润率</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.p.asin)}<small>${esc(x.p.sku)||'未设置 SKU'} · ${esc(x.p.title)}</small></td><td>${x.count}</td><td>${money(x.sales)}</td><td class="${x.profit>=0?'positive':'negative'}">${money(x.profit)}</td><td>${x.sales?(x.profit/x.sales*100).toFixed(1):0}%</td></tr>`).join('')}</tbody></table></section>`}
async function backup(){let d=await data(),count=d.products.length+d.orders.length+d.expenses.length+d.aftersales.length;return `<section class="panel backup"><h3>全部数据备份与恢复</h3><div class="backupBox"><div style="font-size:42px">🛡️</div><h2>保护你的全部经营数据</h2><p>导出文件包括产品、订单、费用、售后、汇率和系统设置。<br>建议每周导出一次，并保存到网盘或移动硬盘。</p><button class="primary" onclick="exportAll()">⇩ 一键导出全部数据</button><button class="secondary" onclick="document.querySelector('#restoreFile').click()">⇧ 从备份恢复</button></div><div class="backupInfo"><div><strong>${count} 条</strong><small>当前经营记录</small></div><div><strong>${d.settings.lastBackup}</strong><small>最近一次导出</small></div><div><strong>JSON 完整备份</strong><small>可跨电脑恢复</small></div></div><p style="color:#cf454c;margin-top:20px">注意：恢复会合并同 ID 数据。导入来历不明的备份前，请先导出当前数据。</p></section>`}
async function exportAll(){let payload={format:'Amazon-FBM-Profit-Backup',version:1,exportedAt:new Date().toISOString(),data:{}};for(let s of stores)payload.data[s]=await all(s);let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a'),date=new Date().toISOString().replace(/[:.]/g,'-');a.href=URL.createObjectURL(blob);a.download=`Amazon-FBM-全部数据备份-${date}.json`;a.click();URL.revokeObjectURL(a.href);await put('settings',{key:'lastBackup',value:new Date().toLocaleString('zh-CN')});toast('全部数据已导出，请保存到网盘');if(page=='backup')render()}
async function restoreAll(file){if(!file)return;try{let x=JSON.parse(await file.text());if(x.format!='Amazon-FBM-Profit-Backup'||!x.data)throw Error();if(!confirm('确定从此备份恢复？相同记录会被备份内容更新。'))return;for(let s of stores)for(let item of(x.data[s]||[]))await put(s,item);toast('备份恢复成功');render()}catch(e){alert('备份文件无法识别，请选择本系统导出的 JSON 文件。')}finally{document.querySelector('#restoreFile').value=''}}
async function exportCSV(store){let xs=await all(store);if(!xs.length)return toast('没有可导出的数据');let keys=[...new Set(xs.flatMap(Object.keys))],csv='\ufeff'+[keys.join(','),...xs.map(x=>keys.map(k=>'"'+String(x[k]??'').replaceAll('"','""')+'"').join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`${store}-${today()}.csv`;a.click();URL.revokeObjectURL(a.href)}
async function settings(){let s=await setting();return `<div class="formgrid"><section class="panel form"><h3>经营参数</h3><form onsubmit="saveSettings(event)"><label>运营抽成比例 %<input name="commission" type="number" step=".01" value="${s.commission*100}"></label><div class="formula-note">Amazon 结算系数固定为 0.75（平台抽佣 25%），无需设置。</div><label>当前 USD/CNY 汇率<input name="fx" type="number" step=".0001" value="${s.fx}"></label><button class="primary">保存设置</button></form></section><section class="panel backup"><h3>数据存储说明</h3><p>数据保存在当前浏览器的 IndexedDB 数据库中，不会发送到任何第三方服务器。</p><p>历史订单保存自己的成交日汇率，不会因为修改当前汇率而变化。</p><button class="primary" onclick="exportAll()">立即导出完整备份</button></section></div>`}async function saveSettings(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));await Promise.all([put('settings',{key:'commission',value:n(f.commission)/100}),put('settings',{key:'defaultFee',value:n(f.defaultFee)/100}),put('settings',{key:'fx',value:n(f.fx)})]);toast('设置已保存');updateFx();render()}async function updateFx(){let s=await setting();txt('fxShow','USD/CNY '+n(s.fx).toFixed(4))}
async function removeItem(store,k){if(store=='products'){let linked=(await all('orders')).some(x=>x.productId==k),p=(await all('products')).find(x=>x.id==k);if(linked){if(!confirm('这个产品已有历史订单，不能硬删除。是否改为停用？'))return;await put('products',{...p,status:'archived',updatedAt:new Date().toISOString()});toast('产品已停用，历史订单关联已保留');return render()}}if(confirm('确定删除这条记录吗？')){await del(store,k);toast('已删除');render()}}function setViewMonth(v){viewMonth=v||monthNow();render()}function quickAdd(){productForm()}function modal(h){document.querySelector('#modalbox').innerHTML=h;document.querySelector('#modal').classList.add('open')}function closeModal(){document.querySelector('#modal').classList.remove('open')}function val(i){return document.querySelector('#'+i)?.value||0}function txt(i,t){let x=document.querySelector('#'+i);if(x)x.textContent=t}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
openDB().then(async()=>{nav();await updateFx();render()}).catch(()=>document.querySelector('#content').innerHTML='<div class="notice">浏览器不支持本地数据库，请使用最新版 Chrome 或 Edge。</div>');
</script></body></html>
