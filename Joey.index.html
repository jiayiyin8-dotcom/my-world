<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JIAYI YIN | PORTFOLIO</title>
    <style>
        /* ==============================
           1. 全局配置：米色背景 + 极简黑
           ============================== */
        :root {
            --bg: #F7F5F0;     /* 柔和高级米色 */
            --black: #111111;  /* 纯净黑 */
            --accent: #f06d06; /* 你的橙色点缀 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--black);
            font-family: "Times New Roman", serif, "PingFang SC";
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 50px;
        }

        /* 顶部导航 */
        nav {
            display: flex;
            justify-content: space-between;
            padding: 50px 0;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        nav a { text-decoration: none; color: var(--black); margin-left: 30px; opacity: 0.5; transition: 0.3s; }
        nav a:hover { opacity: 1; }

        /* ==============================
           2. 英雄区域：大标题与彩色照片
           ============================== */
        .hero {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 60px 0 100px;
            min-height: 70vh;
        }

        .hero-text { flex: 1.5; }
        .hero-text h1 {
            font-size: clamp(50px, 9vw, 130px);
            font-weight: 400;
            letter-spacing: -3px;
            line-height: 0.85;
        }
        .hero-text h1 span {
            display: block;
            font-style: italic;
            opacity: 0.7;
            font-weight: 300;
        }

        .hero-photo {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }
        .photo-wrap {
            width: 85%;
            max-width: 420px;
            background: #fff;
            padding: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05);
            transform: rotate(2deg); /* 微微倾斜 */
        }
        .photo-wrap img {
            width: 100%;
            height: auto;
            display: block;
            filter: none !important; /* 确保彩色显示 */
        }

        /* ==============================
           3. 无限滚动字幕：黑底米字
           ============================== */
        .marquee {
            width: 100vw;
            margin-left: calc(-50vw + 50%);
            background: var(--black);
            color: var(--bg);
            padding: 30px 0;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            margin-bottom: 80px;
        }

        .marquee-content {
            display: flex;
            animation: scroll 25s linear infinite;
        }

        .marquee-text {
            font-family: sans-serif;
            font-size: clamp(60px, 10vw, 110px);
            font-weight: 900;
            text-transform: uppercase;
            padding-right: 50px;
            letter-spacing: -2px;
        }

        @keyframes scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* ==============================
           4. 作品集展示区域
           ============================== */
        .projects {
            padding-bottom: 100px;
        }
        .section-tag {
            font-family: sans-serif;
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 50px;
            opacity: 0.4;
            font-weight: 700;
        }

        .project-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px 40px;
        }

        .project-item {
            text-decoration: none;
            color: inherit;
        }

        .project-img-box {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #e0e0e0;
            overflow: hidden;
            border-radius: 2px;
            margin-bottom: 20px;
        }

        .project-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .project-item:hover img {
            transform: scale(1.05);
        }

        .project-info h3 { font-size: 26px; font-weight: 400; margin: 0; }
        .project-info p {
            font-family: sans-serif;
            font-size: 12px;
            font-weight: 700;
            margin-top: 8px;
            opacity: 0.4;
            letter-spacing: 1px;
        }

        /* ==============================
           5. 页脚
           ============================== */
        footer {
            padding: 80px 0 50px;
            border-top: 1px solid rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            font-family: sans-serif;
            font-size: 12px;
            font-weight: bold;
        }

        /* 响应式 */
        @media (max-width: 850px) {
            .hero { flex-direction: column; align-items: flex-start; }
            .hero-photo { width: 100%; margin-top: 50px; justify-content: flex-start; }
            .project-grid { grid-template-columns: 1fr; }
            .container { padding: 0 30px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <nav>
            <div>JIAYI YIN</div>
            <div class="nav-links">
                <a href="#projects">WORKS</a>
                <a href="mailto:hello@example.com">CONTACT</a>
            </div>
        </nav>

        <section class="hero">
            <div class="hero-text">
                <h1>JIAYI YIN<br><span>Creative Archive</span></h1>
                <p style="margin-top:40px; font-family:sans-serif; font-size:16px; opacity:0.6; max-width:400px;">
                    极简主义者。在包装设计、代码构建与视觉实验中寻找平衡。
                </p>
            </div>

            <div class="hero-photo">
                <div class="photo-wrap">
                    <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=800&auto=format&fit=crop" alt="Hero Photo">
                </div>
            </div>
        </section>
    </div>

    <div class="marquee">
        <div class="marquee-content">
            <span class="marquee-text">Design • Coding • Packaging • Archive •&nbsp;</span>
            <span class="marquee-text">Design • Coding • Packaging • Archive •&nbsp;</span>
        </div>
    </div>

    <div class="container">
        <section id="projects" class="projects">
            <p class="section-tag">SELECTED WORKS</p>
            
            <div class="project-grid">
                <a href="#" class="project-item">
                    <div class="project-img-box">
                        <img src="https://images.unsplash.com/photo-1558655146-d09347e92766?q=80&w=800&auto=format&fit=crop">
                    </div>
                    <div class="project-info">
                        <h3>宇宙迷惑行为大测验</h3>
                        <p>INTERACTIVE / WEB DEVELOPMENT</p>
                    </div>
                </a>

                <a href="#" class="project-item">
                    <div class="project-img-box">
                        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=800&auto=format&fit=crop">
                    </div>
                    <div class="project-info">
                        <h3>Onion Skin 视觉实验</h3>
                        <p>CSS ANIMATION / DESIGN</p>
                    </div>
                </a>
            </div>
        </section>

        <footer>
            <p>© 2026 JIAYI YIN</p>
            <div>
                <a href="#" style="text-decoration:none; color:inherit; margin-left:20px;">WECHAT</a>
                <a href="#" style="text-decoration:none; color:inherit; margin-left:20px;">GITHUB</a>
            </div>
        </footer>
    </div>

</body>
</html>
